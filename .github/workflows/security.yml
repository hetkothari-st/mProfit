name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1' # Mondays 08:00 IST: catches advisories published since the last change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolioos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: portfolioos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Fails on any high or critical advisory in production dependencies.
      # Accepted exceptions live in package.json → pnpm.auditConfig.
      - run: pnpm audit --prod --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reviewed historical false positives are listed in .gitleaksignore.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
