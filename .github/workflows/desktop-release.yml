name: desktop-release

# Builds the desktop installers and uploads them to a DRAFT GitHub release
# named after apps/desktop/package.json "version". Nothing reaches users until
# that draft is published by hand. Steps: portfolioos/docs/desktop/RELEASING.md
on:
  workflow_dispatch:

permissions:
  contents: write # create the draft release and upload installers

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # One draft, created before the builds: two jobs creating it at the same
  # moment each made their own, and the Windows files ended up split across
  # two drafts. electron-builder uploads into the existing draft for the tag.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release (or reuse it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./portfolioos/apps/desktop/package.json').version")
          TAG="v$VERSION"
          EXISTING=$(gh api "repos/${{ github.repository }}/releases" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$EXISTING" != "0" ]; then
            if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
              echo "::error::$TAG is already published. Bump the version in apps/desktop/package.json."
              exit 1
            fi
            echo "Reusing the existing draft for $TAG"
          else
            gh release create "$TAG" --draft --title "$VERSION" --notes "EveryPaisa desktop $VERSION" --target "${{ github.sha }}"
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: portfolioos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: portfolioos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @everypaisa/desktop
      - run: pnpm --filter @everypaisa/desktop run typecheck
      - run: pnpm --filter @everypaisa/desktop run test
      - name: Build and upload to the draft release
        run: pnpm --filter @everypaisa/desktop run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned for now: don't let electron-builder go looking for a
          # signing identity on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
