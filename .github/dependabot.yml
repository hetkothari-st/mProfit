# Weekly dependency updates, grouped so they arrive as a few reviewable PRs.
# Security updates are raised as soon as GitHub publishes an advisory.
# Merging any of these deploys to production — review before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /portfolioos
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need a deliberate upgrade (API changes, e.g. pdfjs-dist, nodemailer).
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # 0.5 only loads from an ESLint flat config; the repo still uses .eslintrc.
      - dependency-name: eslint-plugin-react-refresh
        versions: ['>=0.5.0']

  - package-ecosystem: docker
    directory: /portfolioos/packages/api
    schedule:
      interval: weekly
    ignore:
      # Node stays on 22 until the price feeds' undici redirect handling is
      # fixed for Node 24+ (maxRedirections was removed there).
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /portfolioos/apps/web
    schedule:
      interval: weekly
    ignore:
      # Node stays on 22 until the price feeds' undici redirect handling is
      # fixed for Node 24+ (maxRedirections was removed there).
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
