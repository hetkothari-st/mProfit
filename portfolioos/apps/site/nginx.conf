# Static hosting for the prerendered marketing site.
server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # /features -> /features/index.html (no trailing-slash redirect)
  location / {
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404.html;

  # Hashed build assets never change
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' https:; form-action 'self' mailto:; frame-ancestors 'none'; base-uri 'self'" always;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
}
