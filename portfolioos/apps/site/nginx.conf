# Static hosting for the prerendered marketing site.

# Hashed build assets never change; pages must always be revalidated.
map $uri $site_cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # Set at server level so they reach every response. Visitors ask for
  # /features, not /features/index.html, so a location matching .html never
  # fired for them. No location below may use add_header, or nginx drops all
  # of these for that location.
  add_header Cache-Control $site_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' https:; form-action 'self' mailto:; frame-ancestors 'none'; base-uri 'self'" always;

  # /features -> /features/index.html (no trailing-slash redirect)
  location / {
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
}
