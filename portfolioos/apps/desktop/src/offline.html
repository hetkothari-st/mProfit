<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>EveryPaisa</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0d0f0e; color: #e8e6df; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 360px; padding: 24px; text-align: center; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #a7aba5; }
      button {
        background: #7fae8f; color: #0d0f0e; border: 0; border-radius: 8px; padding: 10px 18px;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      small { display: block; margin-top: 14px; color: #6f736d; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach EveryPaisa</h1>
      <p>Check your internet connection. We'll keep trying, or try again now.</p>
      <button id="retry" type="button">Try again</button>
      <small id="status">Retrying in <span id="n">10</span>s</small>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('url');
      const go = () => { if (target) location.href = target; };
      document.getElementById('retry').addEventListener('click', go);
      let n = 10;
      setInterval(() => {
        n -= 1;
        if (n <= 0) { n = 10; if (navigator.onLine) go(); }
        document.getElementById('n').textContent = String(n);
      }, 1000);
      window.addEventListener('online', go);
    </script>
  </body>
</html>
