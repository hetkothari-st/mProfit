server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers.
  #
  # CSP ships as Report-Only first. It is not enforced: violations are reported
  # in the browser console and nothing is blocked. Enforcing it blind on a live
  # site would break things this file cannot see — the OnlyOffice editor loads
  # its script and iframe from the DocumentServer's own origin, and the API is
  # called cross-origin at whatever VITE_API_URL was baked in at build time.
  # Watch the console on the real site, add the missing origins, then rename
  # the header to Content-Security-Policy to enforce.
  #
  # (${API_URL} is deliberately not used here: it is nginx's upstream address,
  # which is not the origin the browser connects to.)
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.up.railway.app https://accounts.google.com https://checkout.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://accounts.google.com https://api.razorpay.com https://checkout.razorpay.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    resolver ${RESOLVER} valid=30s;
    set $api_upstream ${API_URL};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
