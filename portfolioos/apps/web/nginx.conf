server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers.
  #
  # Enforced CSP. It ran Report-Only first; the origins below are what the app
  # actually loads (checked against the live site's console, 2026-10-06):
  #   - Google sign-in: script, its stylesheet, its iframe, its API calls.
  #   - Razorpay checkout: script, iframe, telemetry.
  #   - OnlyOffice editor: api.js and the editor iframe come from the
  #     DocumentServer's origin. Named exactly — a *.up.railway.app wildcard in
  #     script-src would let an injected script load from any Railway site.
  #     If the DocumentServer's URL changes, change it here too.
  #   - No 'unsafe-inline' in script-src: the one inline script (theme) is
  #     public/theme-init.js. Keep it that way, or an injected <script> runs.
  #     style-src keeps it for React's inline style attributes.
  #   - blob: frames: PDF and attachment previews render blob: URLs in iframes
  #     (untrusted ones sandboxed, see lib/safePreview.ts).
  #   - connect-src *.up.railway.app: the API, at whatever VITE_API_URL was
  #     baked in at build time.
  #   - connect-src api.github.com: latest desktop app release (Settings → Desktop app)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com https://onlyoffice-production-7799.up.railway.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.up.railway.app https://api.github.com https://accounts.google.com https://checkout.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' blob: https://accounts.google.com https://api.razorpay.com https://checkout.razorpay.com https://onlyoffice-production-7799.up.railway.app; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    resolver ${RESOLVER} valid=30s;
    set $api_upstream ${API_URL};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
